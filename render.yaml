services:
  - type: web
    name: telecom-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=/opt/render/project/src uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: DEFAULT_LANGUAGE
        value: nl
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: PYTHON_VERSION
        value: 3.11.0
